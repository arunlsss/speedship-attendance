name: PTO UI checks
on:
  push:
    paths: ['assets/pto*.js', 'tests/pto-*.mjs', 'pto.html', '.github/workflows/pto-ui-tests.yml']
  pull_request:
    paths: ['assets/pto*.js', 'tests/pto-*.mjs', 'pto.html', '.github/workflows/pto-ui-tests.yml']
permissions:
  contents: read
jobs:
  leave-ranges-and-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/pto.js
      - run: node --test tests/pto-model.test.mjs
