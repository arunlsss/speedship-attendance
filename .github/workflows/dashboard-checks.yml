name: Attendance dashboard checks
on:
  push:
    paths: ['assets/dashboard.js', 'tests/dashboard-load.test.cjs', '.github/workflows/dashboard-checks.yml']
  pull_request:
    paths: ['assets/dashboard.js', 'tests/dashboard-load.test.cjs', '.github/workflows/dashboard-checks.yml']
permissions:
  contents: read
jobs:
  dashboard-loading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/dashboard.js
      - run: node --test tests/dashboard-load.test.cjs
